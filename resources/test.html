<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Example Site</title>
	</head>
	<body>
		<!--TODO: add "Ctrl + Q" keybind support to exit the webview-->
		<h1>Header of "Site"</h1>
		<p class="test">Paragraph explaining the site yada yada...</p>
		<div>
			<button class="text-color-system test" id="register">Register</button>
			<button class="text-color-system test" id="login">Log in</button>
		</div>

		<p>-- or --</p>
		<div id="hmm">
			<button id="something">Quick Log in</button>
			<button name="namaste">Login with HTML</button>
		</div>

		<script>
			const div = window.document.getElementById("hmm");
			console.log(`div 1st element innerHTML: ${div.children.item(0).innerHTML}`);
			console.log(`div something element: ${div.children.namedItem("something").innerHTML}`);
			console.log(`div namaste element: ${div.children.namedItem("namaste").innerHTML}`);
			console.log(`div innerHTML: ${div.innerHTML}`);
		</script>
	</body>
</html>
